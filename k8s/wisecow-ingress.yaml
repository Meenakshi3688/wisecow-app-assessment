apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wisecow-ingress
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - 52.66.255.103.nip.io
      secretName: wisecow-tls
  rules:
    - host: 52.66.255.103.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wisecow-service
                port:
                  number: 4499
